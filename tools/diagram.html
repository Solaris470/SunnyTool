<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagram Editor - SunnyTool</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="../assets/shared.css" rel="stylesheet">
    <style>
        :root {
            --de-accent: #6366f1;
            --de-accent-soft: #eef0ff;
            --de-bg: #f7f8fa;
            --de-panel: #ffffff;
            --de-border: #e6e8ee;
            --de-ink: #1f2330;
            --de-muted: #8b90a0;
        }

        body { background-color: var(--de-bg); overflow: hidden; }

        /* Full-bleed editor: override the centered .main-content layout */
        .diagram-main {
            padding: 0 !important;
            height: calc(100vh - 64px);
            overflow: hidden;
            background: var(--de-bg);
            display: flex;
            flex-direction: column;
        }

        .de-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: var(--de-panel);
            border-bottom: 1px solid var(--de-border);
            flex-wrap: wrap;
            min-height: 52px;
        }

        .de-toolbar .de-group {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-right: 8px;
            margin-right: 4px;
            border-right: 1px solid var(--de-border);
        }
        .de-toolbar .de-group:last-child { border-right: none; }

        .de-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--de-ink);
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: background .15s, border-color .15s;
            line-height: 1;
        }
        .de-btn:hover { background: var(--de-accent-soft); }
        .de-btn:active { transform: translateY(1px); }
        .de-btn .material-icons { font-size: 20px; }
        .de-btn.de-primary { background: var(--de-accent); color: #fff; }
        .de-btn.de-primary:hover { background: #4f52d6; }
        .de-btn:disabled { opacity: .4; cursor: not-allowed; }

        .de-title {
            font-weight: 600;
            font-size: 15px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .de-title .material-icons { color: var(--de-accent); }
        .de-spacer { flex: 1; }
        .de-saved {
            font-size: 12px;
            color: var(--de-muted);
            margin-left: 4px;
            white-space: nowrap;
        }

        .de-workspace {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* Left palette */
        .de-palette {
            width: 72px;
            background: var(--de-panel);
            border-right: 1px solid var(--de-border);
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            overflow-y: auto;
        }
        .de-palette .de-tool {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            border: 1px solid var(--de-border);
            background: #fff;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: var(--de-ink);
            font-size: 9px;
            transition: all .15s;
        }
        .de-palette .de-tool:hover { border-color: var(--de-accent); background: var(--de-accent-soft); }
        .de-palette .de-tool.active { border-color: var(--de-accent); background: var(--de-accent-soft); color: var(--de-accent); }
        .de-palette .de-tool svg { width: 26px; height: 22px; pointer-events: none; }
        .de-palette .de-sep { width: 40px; height: 1px; background: var(--de-border); margin: 4px 0; }

        /* Canvas */
        .de-canvas-wrap {
            flex: 1;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 1px 1px, #dfe2ea 1px, transparent 0);
            background-size: 22px 22px;
        }
        #deCanvas { width: 100%; height: 100%; display: block; cursor: default; }
        #deCanvas.de-panning { cursor: grabbing; }
        #deCanvas.de-pan-ready { cursor: grab; }

        .de-node-shape { cursor: move; }
        .de-edge-hit { cursor: pointer; pointer-events: stroke; }
        .de-port {
            fill: #fff;
            stroke: var(--de-accent);
            cursor: crosshair;
        }
        .de-port:hover { fill: var(--de-accent); }
        .de-handle { fill: #fff; stroke: var(--de-accent); cursor: nwse-resize; }

        /* Inline text editor overlay */
        #deTextEdit {
            position: absolute;
            display: none;
            border: 2px solid var(--de-accent);
            border-radius: 6px;
            padding: 4px 6px;
            font-family: inherit;
            text-align: center;
            resize: none;
            outline: none;
            box-shadow: 0 4px 14px rgba(0,0,0,.12);
            z-index: 20;
            background: #fff;
        }
        #deRubber {
            position: absolute;
            display: none;
            border: 1px solid var(--de-accent);
            background: rgba(99,102,241,.10);
            pointer-events: none;
            z-index: 5;
        }

        .de-zoom {
            position: absolute;
            left: 14px;
            bottom: 14px;
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--de-panel);
            border: 1px solid var(--de-border);
            border-radius: 10px;
            padding: 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            z-index: 6;
        }
        .de-zoom button {
            border: none; background: transparent; cursor: pointer;
            border-radius: 8px; padding: 6px; display: flex; color: var(--de-ink);
        }
        .de-zoom button:hover { background: var(--de-accent-soft); }
        .de-zoom .de-zoom-val { font-size: 12px; min-width: 44px; text-align: center; color: var(--de-muted); }

        .de-hint {
            position: absolute;
            right: 14px;
            bottom: 14px;
            font-size: 11px;
            color: var(--de-muted);
            background: rgba(255,255,255,.8);
            padding: 4px 10px;
            border-radius: 8px;
            z-index: 6;
            pointer-events: none;
        }

        /* Right inspector */
        .de-inspector {
            width: 280px;
            background: var(--de-panel);
            border-left: 1px solid var(--de-border);
            padding: 16px;
            overflow-y: auto;
        }
        .de-insp-empty { color: var(--de-muted); font-size: 13px; line-height: 1.7; }
        .de-insp-empty kbd {
            background: #f0f1f5; border: 1px solid var(--de-border);
            border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: monospace;
        }
        .de-field { margin-bottom: 14px; }
        .de-field > label {
            display: block; font-size: 12px; font-weight: 600;
            color: var(--de-muted); margin-bottom: 6px; text-transform: uppercase;
            letter-spacing: .04em;
        }
        .de-field input[type=text], .de-field textarea, .de-field select {
            width: 100%; border: 1px solid var(--de-border); border-radius: 8px;
            padding: 8px 10px; font-family: inherit; font-size: 13px; color: var(--de-ink);
            background: #fff;
        }
        .de-field textarea { resize: vertical; min-height: 60px; }
        .de-field input:focus, .de-field textarea:focus, .de-field select:focus {
            outline: none; border-color: var(--de-accent);
        }
        .de-swatches { display: flex; flex-wrap: wrap; gap: 6px; }
        .de-swatch {
            width: 24px; height: 24px; border-radius: 6px; cursor: pointer;
            border: 1px solid rgba(0,0,0,.12);
        }
        .de-swatch.active { box-shadow: 0 0 0 2px var(--de-accent); }
        .de-row { display: flex; gap: 8px; align-items: center; }
        .de-row > * { flex: 1; }
        .de-color-pick { display: flex; align-items: center; gap: 8px; }
        .de-color-pick input[type=color] {
            width: 36px; height: 32px; border: 1px solid var(--de-border);
            border-radius: 8px; background: #fff; cursor: pointer; padding: 2px;
        }

        .de-fields-list { display: flex; flex-direction: column; gap: 6px; }
        .de-field-row { display: flex; gap: 4px; align-items: center; }
        .de-field-row input { font-size: 12px; padding: 5px 6px; }
        .de-field-row .de-fname { flex: 1.3; }
        .de-field-row .de-ftype { flex: 1; }
        .de-field-row select.de-fkey { flex: 0 0 56px; }
        .de-field-row button {
            border: none; background: transparent; cursor: pointer; color: var(--de-muted);
            display: flex; padding: 2px; border-radius: 4px;
        }
        .de-field-row button:hover { color: #e5484d; background: #fdecec; }
        .de-add-field {
            margin-top: 8px; width: 100%; border: 1px dashed var(--de-border);
            background: #fff; border-radius: 8px; padding: 7px; cursor: pointer;
            color: var(--de-accent); font-size: 12px; font-family: inherit;
        }
        .de-add-field:hover { background: var(--de-accent-soft); }
        .de-insp-section-title {
            font-size: 12px; font-weight: 700; color: var(--de-ink);
            margin: 4px 0 12px; display: flex; align-items: center; gap: 6px;
        }
        .de-insp-section-title .material-icons { font-size: 18px; color: var(--de-accent); }
        .de-danger {
            color: #e5484d !important;
        }
        .de-danger:hover { background: #fdecec !important; }

        @media (max-width: 900px) {
            .de-inspector { width: 220px; }
        }
    </style>
</head>

    <script>
    (function () {
        'use strict';

        // ---- Constants -------------------------------------------------------
        const SVGNS = 'http://www.w3.org/2000/svg';
        const STORAGE_KEY = 'sunnytool-diagram-v1';
        const GRID = 10;             // snap grid (world units)
        const MIN_W = 40, MIN_H = 30;
        const TABLE_HEADER_H = 30, TABLE_ROW_H = 26;
        const SIDES = ['top', 'right', 'bottom', 'left'];
        const PALETTE_COLORS = ['#ffffff', '#eef0ff', '#e0f2fe', '#dcfce7', '#fef9c3', '#ffe4e6', '#f3e8ff', '#1f2937'];

        // ---- DOM refs --------------------------------------------------------
        const svg = document.getElementById('deCanvas');
        const gViewport = document.getElementById('deViewport');
        const gEdges = document.getElementById('deEdges');
        const gNodes = document.getElementById('deNodes');
        const gOverlay = document.getElementById('deOverlayLayer');
        const wrap = document.getElementById('deCanvasWrap');
        const textEdit = document.getElementById('deTextEdit');
        const rubber = document.getElementById('deRubber');
        const inspector = document.getElementById('deInspector');
        const savedLabel = document.getElementById('deSaved');
        const zoomVal = document.getElementById('deZoomVal');

        // ---- State -----------------------------------------------------------
        let doc = blankDoc();
        let view = { x: 80, y: 60, zoom: 1 };
        let selected = new Set();      // node ids
        let selectedEdge = null;       // edge id
        let hoveredNode = null;        // node id (for ports)
        let drag = null;               // active interaction
        let spaceDown = false;
        let history = [];
        let histIndex = -1;
        let renderQueued = false;
        let saveTimer = null;

        // ---- Small helpers ---------------------------------------------------
        function uid() { return 'n' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }
        function clone(o) { return JSON.parse(JSON.stringify(o)); }
        function snap(v) { return Math.round(v / GRID) * GRID; }
        function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

        function el(tag, attrs, text) {
            const n = document.createElementNS(SVGNS, tag);
            if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
            if (text != null) n.textContent = text;
            return n;
        }

        function blankDoc() { return { version: 1, nodes: [], edges: [] }; }

        function sampleDoc() {
            const a = mkNode('round', 120, 60, 'Start');
            const b = mkNode('rect', 110, 200, 'Load data');
            const c = mkNode('diamond', 110, 340, 'Valid?');
            const d = mkNode('round', 320, 340, 'Done');
            const t = mkNode('table', 420, 60, 'users');
            t.name = 'users';
            t.fields = [
                { name: 'id', type: 'int', key: 'PK' },
                { name: 'email', type: 'varchar', key: '' },
                { name: 'created_at', type: 'datetime', key: '' }
            ];
            t.h = TABLE_HEADER_H + t.fields.length * TABLE_ROW_H;
            const nodes = [a, b, c, d, t];
            const edges = [
                { id: uid(), from: a.id, to: b.id, label: '', style: 'orthogonal', arrow: true, stroke: '#5b6072' },
                { id: uid(), from: b.id, to: c.id, label: '', style: 'orthogonal', arrow: true, stroke: '#5b6072' },
                { id: uid(), from: c.id, to: d.id, label: 'yes', style: 'orthogonal', arrow: true, stroke: '#5b6072' }
            ];
            return { version: 1, nodes, edges };
        }

        function mkNode(type, x, y, text) {
            const base = { id: uid(), type, x, y, w: 140, h: 64, text: text || '', fill: '#eef0ff', stroke: '#6366f1', fontSize: 14 };
            if (type === 'ellipse') { base.w = 150; base.h = 90; }
            if (type === 'diamond') { base.w = 130; base.h = 90; }
            if (type === 'text') { base.fill = 'none'; base.stroke = 'none'; base.w = 120; base.h = 36; base.text = text || 'Text'; }
            if (type === 'round') { base.h = 56; }
            if (type === 'table') {
                base.fill = '#ffffff'; base.stroke = '#6366f1'; base.w = 180;
                base.name = text || 'table';
                base.fields = [{ name: 'id', type: 'int', key: 'PK' }];
                base.h = TABLE_HEADER_H + base.fields.length * TABLE_ROW_H;
            }
            return base;
        }

        function nodeById(id) { return doc.nodes.find(n => n.id === id); }
        function edgeById(id) { return doc.edges.find(e => e.id === id); }

        function tableHeight(n) { return TABLE_HEADER_H + Math.max(1, (n.fields || []).length) * TABLE_ROW_H; }

        // ---- Coordinate transforms ------------------------------------------
        function screenToWorld(clientX, clientY) {
            const pt = svg.createSVGPoint();
            pt.x = clientX; pt.y = clientY;
            const m = gViewport.getScreenCTM().inverse();
            const p = pt.matrixTransform(m);
            return { x: p.x, y: p.y };
        }
        function worldToScreen(wx, wy) {
            const pt = svg.createSVGPoint();
            pt.x = wx; pt.y = wy;
            const p = pt.matrixTransform(gViewport.getScreenCTM());
            const r = wrap.getBoundingClientRect();
            return { x: p.x - r.left, y: p.y - r.top };
        }

        // ---- Geometry --------------------------------------------------------
        function portPoint(n, side) {
            switch (side) {
                case 'top': return { x: n.x + n.w / 2, y: n.y };
                case 'right': return { x: n.x + n.w, y: n.y + n.h / 2 };
                case 'bottom': return { x: n.x + n.w / 2, y: n.y + n.h };
                case 'left': return { x: n.x, y: n.y + n.h / 2 };
            }
        }
        function center(n) { return { x: n.x + n.w / 2, y: n.y + n.h / 2 }; }

        // Pick the best pair of sides for an edge based on relative position.
        function autoSides(a, b) {
            const ca = center(a), cb = center(b);
            const dx = cb.x - ca.x, dy = cb.y - ca.y;
            if (Math.abs(dx) >= Math.abs(dy)) {
                return dx >= 0 ? ['right', 'left'] : ['left', 'right'];
            }
            return dy >= 0 ? ['bottom', 'top'] : ['top', 'bottom'];
        }

        function edgePath(e) {
            const a = nodeById(e.from), b = nodeById(e.to);
            if (!a || !b) return null;
            const [sa, sb] = autoSides(a, b);
            const s = portPoint(a, sa), t = portPoint(b, sb);
            let d;
            if (e.style === 'straight') {
                d = `M ${s.x} ${s.y} L ${t.x} ${t.y}`;
            } else if (e.style === 'curved') {
                const horiz = (sa === 'left' || sa === 'right');
                const k = 0.5;
                const c1 = horiz ? { x: s.x + (t.x - s.x) * k, y: s.y } : { x: s.x, y: s.y + (t.y - s.y) * k };
                const c2 = horiz ? { x: t.x - (t.x - s.x) * k, y: t.y } : { x: t.x, y: t.y - (t.y - s.y) * k };
                d = `M ${s.x} ${s.y} C ${c1.x} ${c1.y} ${c2.x} ${c2.y} ${t.x} ${t.y}`;
            } else { // orthogonal
                const horiz = (sa === 'left' || sa === 'right');
                if (horiz) {
                    const mx = (s.x + t.x) / 2;
                    d = `M ${s.x} ${s.y} L ${mx} ${s.y} L ${mx} ${t.y} L ${t.x} ${t.y}`;
                } else {
                    const my = (s.y + t.y) / 2;
                    d = `M ${s.x} ${s.y} L ${s.x} ${my} L ${t.x} ${my} L ${t.x} ${t.y}`;
                }
            }
            return { d, mid: { x: (s.x + t.x) / 2, y: (s.y + t.y) / 2 } };
        }

        function nodeBBox(n) { return { x: n.x, y: n.y, w: n.w, h: n.h }; }

        function hitNode(wx, wy) {
            // topmost first
            for (let i = doc.nodes.length - 1; i >= 0; i--) {
                const n = doc.nodes[i];
                if (wx >= n.x && wx <= n.x + n.w && wy >= n.y && wy <= n.y + n.h) return n;
            }
            return null;
        }

        // ---- Rendering -------------------------------------------------------
        function scheduleRender() {
            if (renderQueued) return;
            renderQueued = true;
            requestAnimationFrame(() => { renderQueued = false; render(); });
        }

        function render() {
            gViewport.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.zoom})`);
            zoomVal.textContent = Math.round(view.zoom * 100) + '%';

            // edges
            gEdges.textContent = '';
            doc.edges.forEach(e => {
                const p = edgePath(e);
                if (!p) return;
                const hit = el('path', { d: p.d, fill: 'none', stroke: 'transparent', 'stroke-width': 12, class: 'de-edge-hit' });
                hit.dataset.edgeId = e.id;
                gEdges.appendChild(hit);
                const isSel = selectedEdge === e.id;
                const line = el('path', {
                    d: p.d, fill: 'none',
                    stroke: isSel ? '#6366f1' : (e.stroke || '#5b6072'),
                    'stroke-width': isSel ? 2.5 : 1.8,
                    'stroke-linejoin': 'round', 'stroke-linecap': 'round'
                });
                line.style.pointerEvents = 'none';
                if (e.arrow !== false) line.setAttribute('marker-end', 'url(#deArrow)');
                gEdges.appendChild(line);
                if (e.label) {
                    const tw = e.label.length * 7 + 10;
                    const bg = el('rect', { x: p.mid.x - tw / 2, y: p.mid.y - 10, width: tw, height: 18, rx: 4, fill: '#fff', stroke: '#e6e8ee' });
                    bg.style.pointerEvents = 'none';
                    gEdges.appendChild(bg);
                    const lbl = el('text', { x: p.mid.x, y: p.mid.y + 3, 'text-anchor': 'middle', 'font-size': 11, fill: '#5b6072' }, e.label);
                    lbl.style.pointerEvents = 'none';
                    gEdges.appendChild(lbl);
                }
            });

            // nodes
            gNodes.textContent = '';
            doc.nodes.forEach(n => gNodes.appendChild(renderNode(n)));

            // overlay (handles + ports)
            gOverlay.textContent = '';
            const s = 1 / view.zoom;
            if (selected.size === 1) {
                const n = nodeById([...selected][0]);
                if (n) renderHandles(n, s);
            } else if (selected.size > 1) {
                renderMultiOutline(s);
            }
            // ports for hovered node (only when idle and not editing)
            if (hoveredNode && !drag && textEdit.style.display === 'none') {
                const n = nodeById(hoveredNode);
                if (n) renderPorts(n, s);
            }
        }

        function renderNode(n) {
            const g = el('g', { class: 'de-node' });
            g.dataset.nodeId = n.id;
            const isSel = selected.has(n.id);
            const stroke = n.stroke === 'none' ? 'none' : (isSel ? '#6366f1' : n.stroke);
            const sw = isSel ? 2 : 1.5;

            if (n.type === 'table') {
                renderTable(g, n, isSel);
            } else if (n.type === 'ellipse') {
                g.appendChild(el('ellipse', { cx: n.x + n.w / 2, cy: n.y + n.h / 2, rx: n.w / 2, ry: n.h / 2, fill: n.fill, stroke, 'stroke-width': sw, class: 'de-node-shape' }));
                appendCenteredText(g, n);
            } else if (n.type === 'diamond') {
                const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
                const pts = `${cx},${n.y} ${n.x + n.w},${cy} ${cx},${n.y + n.h} ${n.x},${cy}`;
                g.appendChild(el('polygon', { points: pts, fill: n.fill, stroke, 'stroke-width': sw, class: 'de-node-shape' }));
                appendCenteredText(g, n);
            } else if (n.type === 'text') {
                // invisible hit box + text
                const box = el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, fill: 'transparent', stroke: isSel ? '#c7c9d1' : 'transparent', 'stroke-dasharray': '4 3', class: 'de-node-shape' });
                box.style.pointerEvents = 'all';
                g.appendChild(box);
                appendCenteredText(g, n);
            } else { // rect / round
                const rx = n.type === 'round' ? n.h / 2 : 10;
                g.appendChild(el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx, fill: n.fill, stroke, 'stroke-width': sw, class: 'de-node-shape' }));
                appendCenteredText(g, n);
            }
            return g;
        }

        function appendCenteredText(g, n) {
            if (!n.text) return;
            const lines = String(n.text).split('\n');
            const cx = n.x + n.w / 2;
            const fs = n.fontSize || 14;
            const total = lines.length * (fs + 4);
            let y = n.y + n.h / 2 - total / 2 + fs;
            const ink = (n.type === 'text') ? (n.stroke && n.stroke !== 'none' ? n.stroke : '#1f2330') : '#1f2330';
            lines.forEach(line => {
                const t = el('text', { x: cx, y, 'text-anchor': 'middle', 'font-size': fs, fill: ink, 'font-family': "'Roboto','Noto Sans Thai',sans-serif" }, line);
                t.style.pointerEvents = 'none';
                g.appendChild(t);
                y += fs + 4;
            });
        }

        function roundedTopRect(x, y, w, h, r) {
            return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
        }

        function renderTable(g, n, isSel) {
            const stroke = isSel ? '#6366f1' : n.stroke;
            const sw = isSel ? 2 : 1.5;
            const fields = n.fields || [];
            n.h = tableHeight(n);
            // body
            g.appendChild(el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: 8, fill: '#fff', stroke, 'stroke-width': sw, class: 'de-node-shape' }));
            // header
            g.appendChild(el('path', { d: roundedTopRect(n.x, n.y, n.w, TABLE_HEADER_H, 8), fill: '#eef0ff', stroke, 'stroke-width': sw, class: 'de-node-shape' }));
            const title = el('text', { x: n.x + 12, y: n.y + TABLE_HEADER_H / 2 + 4, 'font-size': 13, 'font-weight': 700, fill: '#3b3f73' }, n.name || 'table');
            title.style.pointerEvents = 'none';
            g.appendChild(title);
            // rows
            fields.forEach((f, i) => {
                const ry = n.y + TABLE_HEADER_H + i * TABLE_ROW_H;
                if (i > 0) {
                    const sep = el('line', { x1: n.x, y1: ry, x2: n.x + n.w, y2: ry, stroke: '#eef0f2' });
                    sep.style.pointerEvents = 'none';
                    g.appendChild(sep);
                }
                const keyTxt = f.key ? f.key + ' ' : '';
                const nm = el('text', { x: n.x + 12, y: ry + TABLE_ROW_H / 2 + 4, 'font-size': 12, fill: '#1f2330', 'font-weight': f.key === 'PK' ? 700 : 400 }, keyTxt + (f.name || ''));
                nm.style.pointerEvents = 'none';
                g.appendChild(nm);
                if (f.type) {
                    const tp = el('text', { x: n.x + n.w - 10, y: ry + TABLE_ROW_H / 2 + 4, 'font-size': 11, 'text-anchor': 'end', fill: '#8b90a0' }, f.type);
                    tp.style.pointerEvents = 'none';
                    g.appendChild(tp);
                }
            });
        }

        function renderHandles(n, s) {
            const hs = 8 * s;
            const outline = el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, fill: 'none', stroke: '#6366f1', 'stroke-width': s, 'stroke-dasharray': `${4 * s} ${3 * s}` });
            outline.style.pointerEvents = 'none';
            gOverlay.appendChild(outline);
            const pts = {
                nw: [n.x, n.y], n: [n.x + n.w / 2, n.y], ne: [n.x + n.w, n.y],
                e: [n.x + n.w, n.y + n.h / 2], se: [n.x + n.w, n.y + n.h],
                s: [n.x + n.w / 2, n.y + n.h], sw: [n.x, n.y + n.h], w: [n.x, n.y + n.h / 2]
            };
            for (const k in pts) {
                const [hx, hy] = pts[k];
                const h = el('rect', { x: hx - hs / 2, y: hy - hs / 2, width: hs, height: hs, rx: 2 * s, 'stroke-width': s, class: 'de-handle' });
                h.dataset.handle = k;
                gOverlay.appendChild(h);
            }
        }

        function renderMultiOutline(s) {
            const b = selectionBBox();
            if (!b) return;
            const o = el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, fill: 'none', stroke: '#6366f1', 'stroke-width': s, 'stroke-dasharray': `${5 * s} ${4 * s}` });
            o.style.pointerEvents = 'none';
            gOverlay.appendChild(o);
        }

        function renderPorts(n, s) {
            const r = 5 * s;
            SIDES.forEach(side => {
                const p = portPoint(n, side);
                const c = el('circle', { cx: p.x, cy: p.y, r, 'stroke-width': 1.5 * s, class: 'de-port' });
                c.dataset.port = side;
                c.dataset.nodeId = n.id;
                gOverlay.appendChild(c);
            });
        }

        function selectionBBox() {
            const ns = [...selected].map(nodeById).filter(Boolean);
            if (!ns.length) return null;
            let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
            ns.forEach(n => { x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h); });
            return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
        }

        // ---- History & persistence ------------------------------------------
        function pushHistory() {
            history = history.slice(0, histIndex + 1);
            history.push(JSON.stringify(doc));
            if (history.length > 60) history.shift();
            histIndex = history.length - 1;
            updateToolbar();
            scheduleSave();
        }
        function undo() {
            if (histIndex <= 0) return;
            histIndex--;
            doc = JSON.parse(history[histIndex]);
            sanitizeSelection();
            updateToolbar(); scheduleSave(); buildInspector(); scheduleRender();
        }
        function redo() {
            if (histIndex >= history.length - 1) return;
            histIndex++;
            doc = JSON.parse(history[histIndex]);
            sanitizeSelection();
            updateToolbar(); scheduleSave(); buildInspector(); scheduleRender();
        }
        function sanitizeSelection() {
            selected = new Set([...selected].filter(id => nodeById(id)));
            if (selectedEdge && !edgeById(selectedEdge)) selectedEdge = null;
        }
        function scheduleSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(save, 400);
            savedLabel.textContent = 'Saving…';
        }
        function save() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({ doc, view }));
                savedLabel.textContent = 'Saved';
            } catch (e) { savedLabel.textContent = 'Save failed'; }
        }
        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data.doc) doc = data.doc;
                    if (data.view) view = data.view;
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // ---- Mutations -------------------------------------------------------
        function addNodeAtCenter(shape) {
            const r = wrap.getBoundingClientRect();
            const c = screenToWorld(r.left + r.width / 2, r.top + r.height / 2);
            const n = mkNode(shape, snap(c.x - 70), snap(c.y - 32), defaultText(shape));
            doc.nodes.push(n);
            selected = new Set([n.id]); selectedEdge = null;
            pushHistory(); buildInspector(); scheduleRender();
            return n;
        }
        function defaultText(shape) {
            if (shape === 'diamond') return 'Decision?';
            if (shape === 'text') return 'Text';
            if (shape === 'table') return 'table';
            return '';
        }

        function deleteSelection() {
            if (selectedEdge) {
                doc.edges = doc.edges.filter(e => e.id !== selectedEdge);
                selectedEdge = null;
                pushHistory(); buildInspector(); scheduleRender();
                return;
            }
            if (!selected.size) return;
            doc.nodes = doc.nodes.filter(n => !selected.has(n.id));
            doc.edges = doc.edges.filter(e => !selected.has(e.from) && !selected.has(e.to));
            selected.clear();
            pushHistory(); buildInspector(); scheduleRender();
        }

        function duplicateSelection() {
            if (!selected.size) return;
            const map = {};
            const copies = [];
            [...selected].map(nodeById).filter(Boolean).forEach(n => {
                const c = clone(n); c.id = uid(); c.x += 24; c.y += 24;
                map[n.id] = c.id; copies.push(c);
            });
            doc.nodes.push(...copies);
            // duplicate edges fully inside the selection
            doc.edges.filter(e => map[e.from] && map[e.to]).forEach(e => {
                const c = clone(e); c.id = uid(); c.from = map[e.from]; c.to = map[e.to];
                doc.edges.push(c);
            });
            selected = new Set(copies.map(c => c.id));
            pushHistory(); buildInspector(); scheduleRender();
        }

        // ---- Interaction: pointer on canvas ---------------------------------
        svg.addEventListener('mousedown', onCanvasDown);
        svg.addEventListener('mousemove', onHover);
        svg.addEventListener('dblclick', onDblClick);
        svg.addEventListener('contextmenu', e => e.preventDefault());

        function onCanvasDown(e) {
            if (textEdit.style.display !== 'none') commitTextEdit();
            const target = e.target;
            const world = screenToWorld(e.clientX, e.clientY);

            // pan: middle mouse or space-held or empty + grab
            if (e.button === 1 || (spaceDown && e.button === 0)) {
                startPan(e); return;
            }
            if (e.button !== 0) return;

            // resize handle
            if (target.dataset && target.dataset.handle) {
                const n = nodeById([...selected][0]);
                if (n) { startResize(e, n, target.dataset.handle); return; }
            }
            // port → start connecting
            if (target.dataset && target.dataset.port) {
                startConnect(e, target.dataset.nodeId, target.dataset.port); return;
            }
            // node
            const ng = target.closest && target.closest('[data-node-id]');
            if (ng) {
                const id = ng.dataset.nodeId;
                selectedEdge = null;
                if (e.shiftKey) {
                    if (selected.has(id)) selected.delete(id); else selected.add(id);
                } else if (!selected.has(id)) {
                    selected = new Set([id]);
                }
                buildInspector();
                if (selected.has(id)) startMove(e);
                else scheduleRender();
                return;
            }
            // edge
            if (target.dataset && target.dataset.edgeId) {
                selected.clear();
                selectedEdge = target.dataset.edgeId;
                buildInspector(); scheduleRender();
                return;
            }
            // empty canvas → rubber-band select (or clear)
            if (!e.shiftKey) { selected.clear(); selectedEdge = null; buildInspector(); }
            startRubber(e, world);
        }

        function onHover(e) {
            if (drag) return;
            const ng = e.target.closest && e.target.closest('[data-node-id]');
            const id = (e.target.dataset && e.target.dataset.port) ? e.target.dataset.nodeId : (ng ? ng.dataset.nodeId : null);
            if (id !== hoveredNode) { hoveredNode = id; scheduleRender(); }
        }

        // -- pan
        function startPan(e) {
            drag = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
            svg.classList.add('de-panning');
            e.preventDefault();
        }
        // -- move
        function startMove(e) {
            const start = screenToWorld(e.clientX, e.clientY);
            const items = [...selected].map(nodeById).filter(Boolean).map(n => ({ n, ox: n.x, oy: n.y }));
            drag = { type: 'move', start, items, moved: false };
        }
        // -- resize
        function startResize(e, n, handle) {
            drag = { type: 'resize', n, handle, start: screenToWorld(e.clientX, e.clientY), o: { x: n.x, y: n.y, w: n.w, h: n.h } };
        }
        // -- connect
        function startConnect(e, fromId, side) {
            drag = { type: 'connect', from: fromId, side, cur: screenToWorld(e.clientX, e.clientY) };
            scheduleRender();
        }
        // -- rubber band
        function startRubber(e, world) {
            drag = { type: 'rubber', start: world, startClient: { x: e.clientX, y: e.clientY } };
            rubber.style.display = 'block';
            updateRubberDom(e.clientX, e.clientY, e.clientX, e.clientY);
        }

        window.addEventListener('mousemove', onWindowMove);
        window.addEventListener('mouseup', onWindowUp);

        function onWindowMove(e) {
            if (!drag) return;
            if (drag.type === 'pan') {
                view.x = drag.vx + (e.clientX - drag.sx);
                view.y = drag.vy + (e.clientY - drag.sy);
                scheduleRender(); return;
            }
            const world = screenToWorld(e.clientX, e.clientY);
            if (drag.type === 'move') {
                const dx = snap(world.x - drag.start.x), dy = snap(world.y - drag.start.y);
                if (dx || dy) drag.moved = true;
                drag.items.forEach(it => { it.n.x = it.ox + dx; it.n.y = it.oy + dy; });
                scheduleRender();
            } else if (drag.type === 'resize') {
                applyResize(drag, world); scheduleRender();
            } else if (drag.type === 'connect') {
                drag.cur = world;
                drawTempEdge(drag);
            } else if (drag.type === 'rubber') {
                updateRubberDom(drag.startClient.x, drag.startClient.y, e.clientX, e.clientY);
            }
        }

        function onWindowUp(e) {
            if (!drag) return;
            const d = drag;
            if (d.type === 'pan') { svg.classList.remove('de-panning'); scheduleSave(); }
            if (d.type === 'move') { if (d.moved) pushHistory(); }
            if (d.type === 'resize') { pushHistory(); }
            if (d.type === 'connect') {
                const world = screenToWorld(e.clientX, e.clientY);
                const tgt = hitNode(world.x, world.y);
                if (tgt && tgt.id !== d.from) {
                    doc.edges.push({ id: uid(), from: d.from, to: tgt.id, label: '', style: 'orthogonal', arrow: true, stroke: '#5b6072' });
                    pushHistory();
                }
            }
            if (d.type === 'rubber') {
                rubber.style.display = 'none';
                selectByRect(d.start, screenToWorld(e.clientX, e.clientY), e.shiftKey);
                buildInspector();
            }
            drag = null;
            scheduleRender();
        }

        function applyResize(d, world) {
            const o = d.o, h = d.handle;
            let x = o.x, y = o.y, w = o.w, ht = o.h;
            const wx = snap(world.x), wy = snap(world.y);
            if (h.includes('e')) w = Math.max(MIN_W, wx - o.x);
            if (h.includes('s')) ht = Math.max(MIN_H, wy - o.y);
            if (h.includes('w')) { const nx = Math.min(wx, o.x + o.w - MIN_W); w = o.x + o.w - nx; x = nx; }
            if (h.includes('n')) { const ny = Math.min(wy, o.y + o.h - MIN_H); ht = o.y + o.h - ny; y = ny; }
            d.n.x = x; d.n.y = y; d.n.w = w;
            if (d.n.type !== 'table') d.n.h = ht;
        }

        function drawTempEdge(d) {
            const from = nodeById(d.from);
            if (!from) return;
            const s = portPoint(from, d.side);
            // render base then overlay temp
            scheduleRender();
            requestAnimationFrame(() => {
                if (!drag || drag.type !== 'connect') return;
                const line = el('path', { d: `M ${s.x} ${s.y} L ${d.cur.x} ${d.cur.y}`, fill: 'none', stroke: '#6366f1', 'stroke-width': 2 / view.zoom, 'stroke-dasharray': `${5 / view.zoom} ${4 / view.zoom}` });
                line.setAttribute('marker-end', 'url(#deArrow)');
                line.style.pointerEvents = 'none';
                gOverlay.appendChild(line);
                const tgt = hitNode(d.cur.x, d.cur.y);
                if (tgt && tgt.id !== d.from) {
                    gOverlay.appendChild(el('rect', { x: tgt.x - 2, y: tgt.y - 2, width: tgt.w + 4, height: tgt.h + 4, rx: 8, fill: 'none', stroke: '#6366f1', 'stroke-width': 2 / view.zoom }));
                }
            });
        }

        function updateRubberDom(x1, y1, x2, y2) {
            const r = wrap.getBoundingClientRect();
            const left = Math.min(x1, x2) - r.left, top = Math.min(y1, y2) - r.top;
            rubber.style.left = left + 'px';
            rubber.style.top = top + 'px';
            rubber.style.width = Math.abs(x2 - x1) + 'px';
            rubber.style.height = Math.abs(y2 - y1) + 'px';
        }

        function selectByRect(a, b, additive) {
            const x1 = Math.min(a.x, b.x), y1 = Math.min(a.y, b.y), x2 = Math.max(a.x, b.x), y2 = Math.max(a.y, b.y);
            if (!additive) selected.clear();
            doc.nodes.forEach(n => {
                if (n.x < x2 && n.x + n.w > x1 && n.y < y2 && n.y + n.h > y1) selected.add(n.id);
            });
        }

        // ---- Double-click to edit text --------------------------------------
        function onDblClick(e) {
            const ng = e.target.closest && e.target.closest('[data-node-id]');
            if (!ng) return;
            const n = nodeById(ng.dataset.nodeId);
            if (!n) return;
            openTextEdit(n);
        }

        function openTextEdit(n) {
            const isTable = n.type === 'table';
            const tl = worldToScreen(n.x, n.y);
            const br = worldToScreen(n.x + n.w, n.y + (isTable ? TABLE_HEADER_H : n.h));
            textEdit.style.display = 'block';
            textEdit.style.left = tl.x + 'px';
            textEdit.style.top = tl.y + 'px';
            textEdit.style.width = (br.x - tl.x) + 'px';
            textEdit.style.height = (br.y - tl.y) + 'px';
            textEdit.style.fontSize = ((n.fontSize || 14) * view.zoom) + 'px';
            textEdit.value = isTable ? (n.name || '') : (n.text || '');
            textEdit.dataset.target = n.id;
            textEdit.dataset.field = isTable ? 'name' : 'text';
            textEdit.focus();
            textEdit.select();
            scheduleRender();
        }

        function commitTextEdit() {
            const id = textEdit.dataset.target;
            if (!id) { textEdit.style.display = 'none'; return; }
            const n = nodeById(id);
            if (n) {
                n[textEdit.dataset.field] = textEdit.value;
                pushHistory();
            }
            textEdit.style.display = 'none';
            textEdit.dataset.target = '';
            buildInspector(); scheduleRender();
        }

        textEdit.addEventListener('blur', commitTextEdit);
        textEdit.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); textEdit.blur(); }
            if (e.key === 'Escape') { textEdit.dataset.target = ''; textEdit.style.display = 'none'; scheduleRender(); }
            e.stopPropagation();
        });

        // ---- Zoom & pan via wheel -------------------------------------------
        wrap.addEventListener('wheel', e => {
            e.preventDefault();
            const r = wrap.getBoundingClientRect();
            const factor = Math.pow(1.0015, -e.deltaY);
            zoomAt(e.clientX - r.left, e.clientY - r.top, factor);
        }, { passive: false });

        function zoomAt(px, py, factor) {
            const nz = clamp(view.zoom * factor, 0.2, 4);
            const k = nz / view.zoom;
            view.x = px - (px - view.x) * k;
            view.y = py - (py - view.y) * k;
            view.zoom = nz;
            scheduleRender(); scheduleSave();
        }

        function fitView() {
            if (!doc.nodes.length) { view = { x: 80, y: 60, zoom: 1 }; scheduleRender(); return; }
            let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
            doc.nodes.forEach(n => { x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h); });
            const pad = 60;
            const r = wrap.getBoundingClientRect();
            const zw = r.width / (x2 - x1 + pad * 2), zh = r.height / (y2 - y1 + pad * 2);
            view.zoom = clamp(Math.min(zw, zh), 0.2, 2);
            view.x = (r.width - (x2 - x1) * view.zoom) / 2 - x1 * view.zoom;
            view.y = (r.height - (y2 - y1) * view.zoom) / 2 - y1 * view.zoom;
            scheduleRender(); scheduleSave();
        }

        // ---- Inspector -------------------------------------------------------
        function buildInspector() {
            inspector.textContent = '';
            if (selectedEdge) { inspectorForEdge(edgeById(selectedEdge)); return; }
            if (selected.size === 0) { inspectorEmpty(); return; }
            if (selected.size > 1) { inspectorMulti(); return; }
            const n = nodeById([...selected][0]);
            if (!n) { inspectorEmpty(); return; }
            if (n.type === 'table') inspectorForTable(n); else inspectorForNode(n);
        }

        function field(labelText) {
            const f = document.createElement('div'); f.className = 'de-field';
            if (labelText) { const l = document.createElement('label'); l.textContent = labelText; f.appendChild(l); }
            inspector.appendChild(f); return f;
        }
        function sectionTitle(icon, txt) {
            const d = document.createElement('div'); d.className = 'de-insp-section-title';
            const i = document.createElement('span'); i.className = 'material-icons'; i.textContent = icon;
            d.appendChild(i); d.appendChild(document.createTextNode(txt)); inspector.appendChild(d);
        }

        function inspectorEmpty() {
            const d = document.createElement('div'); d.className = 'de-insp-empty';
            d.innerHTML = 'No selection.<br><br>' +
                '• Click a shape on the left to add it<br>' +
                '• Drag from a node edge dot to connect<br>' +
                '• Double-click to edit text<br>' +
                '• Drag on empty space to box-select<br><br>' +
                '<kbd>Del</kbd> remove · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicate · hold <kbd>Space</kbd> to pan';
            inspector.appendChild(d);
        }
        function inspectorMulti() {
            sectionTitle('select_all', selected.size + ' items selected');
            const f = field('');
            const btn = document.createElement('button'); btn.className = 'de-add-field de-danger';
            btn.textContent = 'Delete selected'; btn.onclick = deleteSelection; f.appendChild(btn);
        }

        function colorRow(labelText, value, apply) {
            const f = field(labelText);
            const row = document.createElement('div'); row.className = 'de-color-pick';
            const cp = document.createElement('input'); cp.type = 'color';
            cp.value = /^#([0-9a-f]{6})$/i.test(value) ? value : '#ffffff';
            const sw = document.createElement('div'); sw.className = 'de-swatches';
            PALETTE_COLORS.forEach(c => {
                const s = document.createElement('div'); s.className = 'de-swatch'; s.style.background = c;
                if (c.toLowerCase() === (value || '').toLowerCase()) s.classList.add('active');
                s.onclick = () => { cp.value = c; apply(c); pushHistory(); };
                sw.appendChild(s);
            });
            cp.oninput = () => apply(cp.value);   // live preview
            cp.onchange = () => pushHistory();    // commit one undo step
            row.appendChild(cp); row.appendChild(sw); f.appendChild(row);
        }

        function inspectorForNode(n) {
            sectionTitle('category', n.type[0].toUpperCase() + n.type.slice(1));
            const tf = field('Text');
            const ta = document.createElement('textarea'); ta.value = n.text || '';
            ta.oninput = () => { n.text = ta.value; scheduleRender(); };
            ta.onchange = () => pushHistory();
            tf.appendChild(ta);

            if (n.type !== 'text') colorRow('Fill', n.fill, c => { n.fill = c; scheduleRender(); });
            colorRow(n.type === 'text' ? 'Text color' : 'Stroke', n.stroke === 'none' ? '#1f2330' : n.stroke, c => { n.stroke = c; scheduleRender(); });

            const sf = field('Font size');
            const fr = document.createElement('div'); fr.className = 'de-row';
            const num = document.createElement('input'); num.type = 'text'; num.value = n.fontSize || 14;
            num.oninput = () => { const v = parseInt(num.value, 10); if (v >= 6 && v <= 96) { n.fontSize = v; scheduleRender(); } };
            num.onchange = () => pushHistory();
            fr.appendChild(num); sf.appendChild(fr);
            deleteButton();
        }

        function inspectorForTable(n) {
            sectionTitle('table_chart', 'ER Table');
            const nf = field('Table name');
            const ni = document.createElement('input'); ni.type = 'text'; ni.value = n.name || '';
            ni.oninput = () => { n.name = ni.value; scheduleRender(); };
            ni.onchange = () => pushHistory();
            nf.appendChild(ni);

            const ff = field('Fields');
            const list = document.createElement('div'); list.className = 'de-fields-list';
            (n.fields || []).forEach((fld, i) => list.appendChild(fieldRow(n, fld, i)));
            ff.appendChild(list);
            const add = document.createElement('button'); add.className = 'de-add-field';
            add.textContent = '+ Add field';
            add.onclick = () => { n.fields.push({ name: 'column', type: 'varchar', key: '' }); n.h = tableHeight(n); pushHistory(); buildInspector(); scheduleRender(); };
            ff.appendChild(add);
            colorRow('Header', n.fill, c => { n.fill = c; scheduleRender(); });
            deleteButton();
        }

        function fieldRow(n, fld, i) {
            const row = document.createElement('div'); row.className = 'de-field-row';
            const name = document.createElement('input'); name.className = 'de-fname'; name.type = 'text'; name.value = fld.name || ''; name.placeholder = 'name';
            name.oninput = () => { fld.name = name.value; scheduleRender(); };
            name.onchange = () => pushHistory();
            const type = document.createElement('input'); type.className = 'de-ftype'; type.type = 'text'; type.value = fld.type || ''; type.placeholder = 'type';
            type.oninput = () => { fld.type = type.value; scheduleRender(); };
            type.onchange = () => pushHistory();
            const key = document.createElement('select'); key.className = 'de-fkey';
            ['', 'PK', 'FK'].forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = k || '—'; if ((fld.key || '') === k) o.selected = true; key.appendChild(o); });
            key.onchange = () => { fld.key = key.value; scheduleRender(); pushHistory(); };
            const del = document.createElement('button'); del.title = 'Remove field';
            del.innerHTML = '<span class="material-icons" style="font-size:16px">close</span>';
            del.onclick = () => { n.fields.splice(i, 1); n.h = tableHeight(n); pushHistory(); buildInspector(); scheduleRender(); };
            row.appendChild(name); row.appendChild(type); row.appendChild(key); row.appendChild(del);
            return row;
        }

        function inspectorForEdge(e) {
            if (!e) { inspectorEmpty(); return; }
            sectionTitle('timeline', 'Connection');
            const lf = field('Label');
            const li = document.createElement('input'); li.type = 'text'; li.value = e.label || '';
            li.oninput = () => { e.label = li.value; scheduleRender(); };
            li.onchange = () => pushHistory();
            lf.appendChild(li);

            const sf = field('Line style');
            const sel = document.createElement('select');
            [['orthogonal', 'Elbow'], ['straight', 'Straight'], ['curved', 'Curved']].forEach(([v, t]) => {
                const o = document.createElement('option'); o.value = v; o.textContent = t; if (e.style === v) o.selected = true; sel.appendChild(o);
            });
            sel.onchange = () => { e.style = sel.value; scheduleRender(); pushHistory(); };
            sf.appendChild(sel);

            const af = field('');
            const lbl = document.createElement('label'); lbl.style.display = 'flex'; lbl.style.gap = '8px'; lbl.style.alignItems = 'center'; lbl.style.textTransform = 'none'; lbl.style.cursor = 'pointer';
            const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = e.arrow !== false; cb.style.flex = '0 0 auto';
            cb.onchange = () => { e.arrow = cb.checked; scheduleRender(); pushHistory(); };
            lbl.appendChild(cb); lbl.appendChild(document.createTextNode('Arrow head'));
            af.appendChild(lbl);

            colorRow('Color', e.stroke || '#5b6072', c => { e.stroke = c; scheduleRender(); });
            deleteButton('Delete connection');
        }

        function deleteButton(txt) {
            const f = field('');
            const btn = document.createElement('button'); btn.className = 'de-add-field de-danger';
            btn.style.borderColor = '#f3c0c2';
            btn.textContent = txt || 'Delete';
            btn.onclick = deleteSelection;
            f.appendChild(btn);
        }

        // ---- Toolbar wiring --------------------------------------------------
        document.getElementById('dePalette').addEventListener('click', e => {
            const b = e.target.closest('[data-shape]');
            if (b) addNodeAtCenter(b.dataset.shape);
        });
        document.getElementById('deUndo').onclick = undo;
        document.getElementById('deRedo').onclick = redo;
        document.getElementById('deDelete').onclick = deleteSelection;
        document.getElementById('deDuplicate').onclick = duplicateSelection;
        document.getElementById('deFit').onclick = fitView;
        document.getElementById('deZoomIn').onclick = () => { const r = wrap.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.2); };
        document.getElementById('deZoomOut').onclick = () => { const r = wrap.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.2); };
        document.getElementById('deZoomReset').onclick = () => { view.zoom = 1; scheduleRender(); scheduleSave(); };
        document.getElementById('deExportJson').onclick = exportJson;
        document.getElementById('deExportSvg').onclick = exportSvg;
        document.getElementById('deExportPng').onclick = exportPng;
        document.getElementById('deImport').onclick = () => document.getElementById('deFileInput').click();
        document.getElementById('deFileInput').addEventListener('change', importJson);

        function updateToolbar() {
            document.getElementById('deUndo').disabled = histIndex <= 0;
            document.getElementById('deRedo').disabled = histIndex >= history.length - 1;
        }

        // ---- Keyboard --------------------------------------------------------
        window.addEventListener('keydown', e => {
            const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
            if (e.code === 'Space' && !typing) { spaceDown = true; svg.classList.add('de-pan-ready'); }
            if (typing) return;
            const ctrl = e.ctrlKey || e.metaKey;
            if (ctrl && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
            else if (ctrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
            else if (ctrl && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelection(); }
            else if (ctrl && e.key.toLowerCase() === 'a') { e.preventDefault(); selected = new Set(doc.nodes.map(n => n.id)); selectedEdge = null; buildInspector(); scheduleRender(); }
            else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); }
            else if (e.key === 'Escape') { selected.clear(); selectedEdge = null; buildInspector(); scheduleRender(); }
            else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && selected.size) {
                e.preventDefault();
                const step = e.shiftKey ? GRID : 1;
                const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
                const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
                [...selected].map(nodeById).filter(Boolean).forEach(n => { n.x += dx; n.y += dy; });
                scheduleRender();
            }
        });
        window.addEventListener('keyup', e => {
            if (e.code === 'Space') { spaceDown = false; svg.classList.remove('de-pan-ready'); }
        });

        // ---- Export / import -------------------------------------------------
        function download(filename, blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
        function exportJson() {
            download('diagram.json', new Blob([JSON.stringify(doc, null, 2)], { type: 'application/json' }));
        }
        function importJson(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    if (!data || !Array.isArray(data.nodes)) throw new Error('bad');
                    doc = { version: 1, nodes: data.nodes, edges: data.edges || [] };
                    selected.clear(); selectedEdge = null;
                    pushHistory(); buildInspector(); fitView();
                } catch (err) { alert('ไฟล์ไม่ถูกต้อง — ต้องเป็น JSON ที่ export จากเครื่องมือนี้'); }
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        // Build a standalone SVG string of the diagram (no UI overlay).
        function buildExportSvg() {
            if (!doc.nodes.length) return null;
            let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
            doc.nodes.forEach(n => { x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h); });
            const pad = 30;
            x1 -= pad; y1 -= pad; x2 += pad; y2 += pad;
            const W = x2 - x1, H = y2 - y1;
            const out = document.createElementNS(SVGNS, 'svg');
            out.setAttribute('xmlns', SVGNS);
            out.setAttribute('width', W);
            out.setAttribute('height', H);
            out.setAttribute('viewBox', `${x1} ${y1} ${W} ${H}`);
            const defs = document.createElementNS(SVGNS, 'defs');
            defs.innerHTML = '<marker id="deArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6072"></path></marker>';
            out.appendChild(defs);
            out.appendChild(el('rect', { x: x1, y: y1, width: W, height: H, fill: '#ffffff' }));
            // clone current edges/nodes layers without selection styling
            const savedSel = new Set(selected), savedEdge = selectedEdge, savedHover = hoveredNode;
            selected = new Set(); selectedEdge = null; hoveredNode = null;
            render();
            out.appendChild(gEdges.cloneNode(true));
            out.appendChild(gNodes.cloneNode(true));
            selected = savedSel; selectedEdge = savedEdge; hoveredNode = savedHover;
            scheduleRender();
            return { svg: out, W, H };
        }

        function exportSvg() {
            const r = buildExportSvg();
            if (!r) { alert('ยังไม่มี diagram'); return; }
            const str = new XMLSerializer().serializeToString(r.svg);
            download('diagram.svg', new Blob([str], { type: 'image/svg+xml' }));
        }

        function exportPng() {
            const r = buildExportSvg();
            if (!r) { alert('ยังไม่มี diagram'); return; }
            const str = new XMLSerializer().serializeToString(r.svg);
            const scale = 2;
            const img = new Image();
            const svgBlob = new Blob([str], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = r.W * scale; canvas.height = r.H * scale;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.scale(scale, scale);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);
                canvas.toBlob(b => download('diagram.png', b), 'image/png');
            };
            img.onerror = () => { URL.revokeObjectURL(url); alert('Export PNG ล้มเหลว'); };
            img.src = url;
        }

        // ---- Init ------------------------------------------------------------
        function init() {
            if (!load()) doc = sampleDoc();
            doc.nodes.forEach(n => { if (n.type === 'table') n.h = tableHeight(n); });
            history = [JSON.stringify(doc)]; histIndex = 0;
            updateToolbar();
            buildInspector();
            render();
            savedLabel.textContent = 'Saved';
        }
        init();
    })();
    </script>
</body>
