        button {

        button:hover {

        .stats {

            color: #2196f3;

            border-radius: 8px;

        .copy-button:hover {

        .success-message {

            padding: 10px 15px;

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="container">
        <h1>🔧 เครื่องมือแก้ไขข้อความไทยจาก PDF</h1>
        
        <div class="input-section">
            <h2 class="section-title">📝 ข้อความที่ต้องการแก้ไข</h2>
            <textarea id="inputText" placeholder="วางข้อความที่คัดลอกมาจาก PDF ที่มีปัญหาสระและวรรณยุกต์ไม่ติดมาด้วยที่นี่...&#10;&#10;ตอัวยาง: สวยมาก, เดือนมิถุนายน, การบรหาร"></textarea>
        </div>
        
        <div class="button-container">
            <button onclick="fixTextWithAI()" id="aiFixButton">✨ แก้ไขด้วย AI</button>
            <button onclick="clearAll()">🗑️ ล้างทั้งหมด</button>
        </div>
        
        <div id="stats" class="stats" style="display: none;">
            <div id="statsContent"></div>
        </div>
        
        <div class="output-section">
            <h2 class="section-title">✅ ข้อความที่แก้ไขแล้ว</h2>
            <textarea id="outputText" placeholder="ข้อความที่แก้ไขแล้วจะปรากฏที่นี่..." readonly></textarea>
            <button class="copy-button" onclick="copyToClipboard()" style="display: none;" id="copyButton">📋 คัดลอกข้อความ</button>
            <div class="success-message" id="successMessage">คัดลอกข้อความเรียบร้อยแล้ว! ✅</div>
        </div>
    </div>

    <script src="../assets/shared.js"></script>
    <script src="../assets/config.js"></script> 
    <script>
        async function fixTextWithAI() {
            if (typeof GEMINI_API_KEY === 'undefined' || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
                alert('กรุณาตั้งค่า Gemini API Key ของคุณในไฟล์ assets/config.js ก่อนใช้งาน');
                return;
            }

            const inputText = document.getElementById('inputText').value;
            if (!inputText.trim()) {
                alert('กรุณาใส่ข้อความที่ต้องการแก้ไข');
                return;
            }

            const aiButton = document.getElementById('aiFixButton');
            const originalButtonText = aiButton.innerHTML;
            aiButton.innerHTML = '✨ กำลังประมวลผล...';
            aiButton.disabled = true;

            // ใช้ Model ที่เสถียรกว่า (v1beta/models/gemini-1.5-flash)
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;

            const prompt = `
            คุณคือผู้เชี่ยวชาญด้านภาษาไทยที่มีหน้าที่แก้ไขข้อความที่คัดลอกมาจากไฟล์ PDF ซึ่งมีข้อผิดพลาดจากการตัดคำและวางสระวรรณยุกต์ผิดตำแหน่ง
            โปรดแก้ไขข้อความต่อไปนี้ให้ถูกต้องตามหลักไวยากรณ์และบริบทภาษาไทย โดยเน้นแก้ไขปัญหาต่อไปนี้:
            1. สระอำ (ำ) ที่หายไป หรือแสดงเป็น " า" (สระอา เว้นวรรค)
            2. สระและวรรณยุกต์ที่ควรอยู่บนหรือล่างพยัญชนะแต่กลับแยกออกมาอยู่ข้างๆ โดยมีเว้นวรรคคั่น
            3. การเว้นวรรคผิดที่กลางคำ

            ตัวอย่างการแก้ไข:
            - "การด าเนินงาน" -> "การดำเนินงาน"
            - "ส าคัญ มาก" -> "สำคัญมาก"
            - "บริ หาร จัด การ" -> "บริหารจัดการ"
            - "นี่ เ ป็น สิ่ ง ที่ ดี" -> "นี่เป็นสิ่งที่ดี"

            ข้อความที่ต้องแก้ไข:
            "${inputText}"

            โปรดตอบกลับเฉพาะข้อความที่แก้ไขสมบูรณ์แล้วเท่านั้น โดยไม่ต้องมีคำอธิบายหรือข้อความอื่นใดๆ เพิ่มเติม
            `;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: prompt
                            }]
                        }]
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`API Error: ${response.status} ${response.statusText} - ${errorData.error.message}`);
                }

                const data = await response.json();
                const fixedText = data.candidates[0].content.parts[0].text.trim();
                
                document.getElementById('outputText').value = fixedText;
                document.getElementById('copyButton').style.display = 'inline-block';

                 // แสดงสถิติแบบง่าย
                const statsDiv = document.getElementById('stats');
                const statsContent = document.getElementById('statsContent');
                statsContent.innerHTML = `
                    ✨ แก้ไขด้วย AI เรียบร้อยแล้ว<br>
                    📊 ความยาวข้อความเดิม: ${inputText.length} ตัวอักษร<br>
                    📈 ความยาวข้อความใหม่: ${fixedText.length} ตัวอักษร
                `;
                statsDiv.style.display = 'block';
                
            } catch (error) {
                console.error('Error calling Gemini API:', error);
                
                Swal.fire({
                    title: 'Google API ผิดพลาด',
                    text: 'ขณะนี้ Google API ผิดพลาด คุณต้องการใช้การแปลงจากระบบหรือไม่?',
                    icon: 'error',
                    showCancelButton: true,
                    confirmButtonColor: '#3085d6',
                    cancelButtonColor: '#d33',
                    confirmButtonText: 'ใช่, ใช้ระบบแปลง',
                    cancelButtonText: 'ไม่, ยกเลิก'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fixTextSystem();
                    }
                });

            } finally {
                aiButton.innerHTML = originalButtonText;
                aiButton.disabled = false;
            }
        }

        function fixTextSystem() {
             let text = document.getElementById('inputText').value;
             
             // 1. แก้สระอำ (ำ) ที่หายไป หรือแสดงเป็น " า" หรือ " ำ"
             text = text.replace(/([ก-ฮ])\s+[าำ]/g, '$1ำ');
             
             // 2. แก้สระและวรรณยุกต์ลอย (เว้นวรรคหน้าสระ/วรรณยุกต์)
             text = text.replace(/([ก-ฮ])\s+([ะ-ูเ-ไ่-๋])/g, '$1$2');
             
             // 3. แก้สระหน้าลอย (เว้นวรรคหลังสระหน้า)
             text = text.replace(/([เ-ไ])\s+([ก-ฮ])/g, '$1$2');
             
             // 4. ลบเว้นวรรคระหว่างตัวอักษรไทย (สำหรับกรณีแยกตัวอักษร)
             // ทำซ้ำเพื่อให้แน่ใจว่าลบหมด
             text = text.replace(/([ก-๙])\s+(?=[ก-๙])/g, '$1');
             text = text.replace(/([ก-๙])\s+(?=[ก-๙])/g, '$1');
             
             document.getElementById('outputText').value = text;
             document.getElementById('copyButton').style.display = 'inline-block';
             
             // แสดงสถิติ
             const statsDiv = document.getElementById('stats');
             const statsContent = document.getElementById('statsContent');
             const inputText = document.getElementById('inputText').value;
             
             statsContent.innerHTML = `
                ✨ แก้ไขด้วยระบบเรียบร้อยแล้ว<br>
                📊 ความยาวข้อความเดิม: ${inputText.length} ตัวอักษร<br>
                📈 ความยาวข้อความใหม่: ${text.length} ตัวอักษร
            `;
            statsDiv.style.display = 'block';
            
            // Show success toast/message
            const successMessage = document.getElementById('successMessage');
            successMessage.innerText = 'แก้ไขด้วยระบบเรียบร้อยแล้ว! ✅';
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000);
        }

        function escapeRegex(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function copyToClipboard() {
            const outputText = document.getElementById('outputText');
            outputText.select();
            document.execCommand('copy');
            
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 2000);
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('copyButton').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // เพิ่ม event listener สำหรับ Enter
        document.getElementById('inputText').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                fixTextWithAI();
            }
        });

        // Sidebar functionality is in shared.js
    </script>
    </div>
    </main>
</body>
